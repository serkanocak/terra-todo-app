version: '3.8'

services:
  # PostgreSQL veritabanı
  db:
    image: postgres:16-alpine
    container_name: terra-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - terra-db-data:/var/lib/postgresql/data
    restart: always

  # Adminer — PostgreSQL web arayüzü
  adminer:
    image: adminer
    container_name: terra-adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: always

  # Backend API Servisi
  api:
    build: 
      context: ./src/api
      dockerfile: Dockerfile
    container_name: terra-api
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - db
    restart: always

  # Frontend React Servisi
  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile
    container_name: terra-web
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-your-google-client-id}
    depends_on:
      - api
    restart: always

volumes:
  terra-db-data:
