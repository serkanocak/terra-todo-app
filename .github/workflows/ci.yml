name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # --- BACKEND İŞLERİ ---
  backend-check:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore src/api/Terra.Api.csproj

      - name: Build API
        run: dotnet build src/api/Terra.Api.csproj --no-restore --configuration Release

      # (İleride buraya 'dotnet test' adımı eklenebilir)

  # --- FRONTEND İŞLERİ ---
  frontend-check:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: src/web

      - name: Build Web
        run: npm run build
        working-directory: src/web

  # --- DOCKER KONTROLÜ ---
  docker-check:
    name: Dockerfile Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build API Image
        run: docker build -t terra-api:test src/api/

      - name: Build Web Image
        run: docker build -t terra-web:test src/web/
